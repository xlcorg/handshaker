[package]
name = "handshaker"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Handshaker desktop app (Tauri shell)."
default-run = "handshaker"

[lib]
name = "handshaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dev-only bindings generator. Two things keep it out of `tauri build`'s bundle:
#   1. `required-features` — tauri-cli skips explicit [[bin]] targets whose features
#      are off, so this isn't built by default.
#   2. The source lives in `src/` (NOT `src/bin/`) on purpose: tauri-cli ALSO scans
#      `src/bin/*.rs` and bundles a binary per file-stem with NO feature filtering,
#      which previously added a phantom `export_bindings` the universal-apple-darwin
#      bundler then failed to copy (it isn't lipo'd).
# Run it with:
#   cargo run -p handshaker --bin export-bindings --features export-bindings
[[bin]]
name = "export-bindings"
path = "src/export_bindings.rs"
required-features = ["export-bindings"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
handshaker-core = { path = "../crates/handshaker-core" }
tauri = { workspace = true, features = ["devtools"] }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-decorum = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-specta = { workspace = true }
specta = { workspace = true, features = ["indexmap"] }
specta-typescript = { workspace = true }
indexmap = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time"] }
async-trait.workspace = true
uuid = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-clipboard-manager = "2.3.2"
# Local-time stamp for default Save-As names of stream exports (`response-<stamp>.json`,
# `stream-<stamp>.<ext>`) — the same local stamp the frontend uses for unary saves.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSResponder",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSData",
    "NSDictionary",
    "NSKeyValueCoding",
    "NSValue",
    "NSString",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKWebView",
] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
base64.workspace = true
# Scripted `FakeTransport` + fixture contract for the stream IPC tests.
handshaker-core = { path = "../crates/handshaker-core", features = ["test-support"] }
bytes.workspace = true
prost.workspace = true
prost-reflect.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Opt-in flag that enables the `export-bindings` helper binary (see [[bin]] above).
export-bindings = []
